apiVersion: v1
kind: Namespace
metadata:
  name: zorvia
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zorvia-web
  namespace: zorvia
  labels:
    app: zorvia-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zorvia-web
  template:
    metadata:
      labels:
        app: zorvia-web
    spec:
      serviceAccountName: zorvia-web
      containers:
        - name: zorvia-web
          image: zorvia:local
          command: ["/usr/local/bin/zorvia"]
          args: ["api-serve", "--port", "5151", "--host", "0.0.0.0"]
          ports:
            - containerPort: 5151
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5151
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5151
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zorvia-web
  namespace: zorvia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zorvia-web
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zorvia-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zorvia-web
subjects:
  - kind: ServiceAccount
    name: zorvia-web
    namespace: zorvia
---
apiVersion: v1
kind: Service
metadata:
  name: zorvia-web
  namespace: zorvia
spec:
  type: NodePort
  selector:
    app: zorvia-web
  ports:
    - port: 5151
      targetPort: 5151
      nodePort: 30080
      name: http
