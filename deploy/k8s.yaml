# Zorvia Kubernetes Deployment (Veyron-style in-pod HTTPS)
#
# Lab URL: https://<HOST>:30152/  (30151 is Veyron on shared labs)
# Health:  https://<HOST>:30152/api/v1/health
#
# TLS: self-signed via initContainer into emptyDir /certs (not Ingress/cert-manager).
---
apiVersion: v1
kind: Namespace
metadata:
  name: zorvia-system
  labels:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/part-of: zorvia
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zorvia
  namespace: zorvia-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zorvia
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/console", "virtualmachineinstances/vnc"]
    verbs: ["get"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinesnapshotcontents", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumeclaims", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zorvia
subjects:
  - kind: ServiceAccount
    name: zorvia
    namespace: zorvia-system
roleRef:
  kind: ClusterRole
  name: zorvia
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zorvia-api
  namespace: zorvia-system
  labels:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zorvia
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zorvia
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: zorvia
      initContainers:
        - name: gen-cert
          image: alpine/openssl:3.3.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              openssl req -x509 -nodes -days 3650 \
                -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
                -keyout /certs/tls.key -out /certs/tls.crt \
                -subj "/CN=zorvia/O=ZyvorAI Labs Private Limited" \
                -addext "subjectAltName=DNS:zorvia-api,DNS:zorvia-api.zorvia-system.svc,DNS:localhost,IP:127.0.0.1"
              chown 10001:10001 /certs/tls.key /certs/tls.crt
              chmod 600 /certs/tls.key && chmod 644 /certs/tls.crt
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
      containers:
        - name: zorvia
          image: zorvia:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/zorvia"]
          args:
            - api-serve
            - --port
            - "5151"
            - --host
            - "0.0.0.0"
            - --tls
            - --tls-cert
            - /certs/tls.crt
            - --tls-key
            - /certs/tls.key
          ports:
            - containerPort: 5151
              name: https
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: ZORVIA_WEB_DIR
              value: /usr/share/zorvia/web
            - name: ZORVIA_AUTH_DB
              value: /data/auth.db
            - name: ZORVIA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: zorvia-auth
                  key: admin-user
            - name: ZORVIA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zorvia-auth
                  key: admin-password
            - name: ZORVIA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zorvia-auth
                  key: jwt-secret
            - name: ZORVIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zorvia-auth
                  key: api-key
                  optional: true
            - name: ZORVIA_EXPOSE_HOST
              value: "212.8.248.187"
            - name: HOST
              value: "212.8.248.187"
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            - name: auth-data
              mountPath: /data
      volumes:
        - name: tls-certs
          emptyDir: {}
        - name: auth-data
          emptyDir: {}
---
# Lab bootstrap credentials (change for non-lab). admin / Admin@321
apiVersion: v1
kind: Secret
metadata:
  name: zorvia-auth
  namespace: zorvia-system
  labels:
    app.kubernetes.io/name: zorvia
type: Opaque
stringData:
  admin-user: admin
  admin-password: Admin@321
  jwt-secret: zorvia-lab-jwt-change-me-30152
---
apiVersion: v1
kind: Service
metadata:
  name: zorvia-api
  namespace: zorvia-system
  labels:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/component: api
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
      nodePort: 30152
