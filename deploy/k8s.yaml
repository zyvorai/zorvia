---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zorvia
  namespace: zorvia-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zorvia
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinesnapshotcontents", "virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumeclaims", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zorvia
subjects:
  - kind: ServiceAccount
    name: zorvia
    namespace: zorvia-system
roleRef:
  kind: ClusterRole
  name: zorvia
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Namespace
metadata:
  name: zorvia-system
  labels:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/part-of: zorvia
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zorvia-api
  namespace: zorvia-system
  labels:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zorvia
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zorvia
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: zorvia
      containers:
        - name: zorvia
          image: ghcr.io/zyvorai/zorvia:latest
          args: ["api-serve", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zorvia-api
  namespace: zorvia-system
  labels:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: zorvia
    app.kubernetes.io/component: api
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
