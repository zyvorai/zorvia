[package]
name = "zorvia"
version = "0.1.0"
edition = "2021"
description = "Craft VMs for KubeVirt with Rust power"
license = "Apache-2.0"
authors = ["Your Name <you@example.com>"]

[[bin]]
name = "zorvia"
path = "src/main.rs"

[lib]
name = "zorvia"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
kube = { version = "0.95", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
schemars = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
regex = "1.10"
chrono = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
rand = "0.8"

# TUI dependencies
ratatui = "0.28"
crossterm = "0.28"
colored = "3.1"
owo-colors = "4.0"
miette = { version = "7.0", features = ["fancy"] }
toml = "0.8"
dirs = "5.0"
rustyline = "17.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
