[package]
name = "zorvia"
version = "0.2.0"
edition = "2021"
description = "Craft VMs for KubeVirt with Rust power"
license = "Apache-2.0"
authors = ["Susant Sahani"]
repository = "https://github.com/zyvorai/zorvia"
homepage = "https://github.com/zyvorai/zorvia"
documentation = "https://docs.rs/zorvia"
readme = "README.md"
keywords = ["kubevirt", "kubernetes", "virtual-machine", "kvm", "cli"]
categories = ["command-line-utilities", "virtualization"]
rust-version = "1.76"

[[bin]]
name = "zorvia"
path = "src/main.rs"

[lib]
name = "zorvia"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
kube = { version = "0.95", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
schemars = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
regex = "1.10"
chrono = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
rand = "0.8"

# TUI dependencies
ratatui = "0.28"
crossterm = "0.28"
colored = "3.1"
owo-colors = "4.0"
miette = { version = "7.0", features = ["fancy"] }
toml = "0.8"
dirs = "5.0"
rustyline = "17.0"

# Web dashboard dependencies
axum = { version = "0.7", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tower-http = { version = "0.6", features = ["cors", "timeout"], optional = true }

[features]
default = ["web"]
web = ["axum", "axum-server", "rustls", "tower-http"]

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
