[package]
name = "zorvia"
version = "0.2.0"
edition = "2021"
description = "Craft VMs for KubeVirt with Rust power"
license = "Apache-2.0"
authors = ["ZyvorAI Labs Private Limited <info@zyvor.dev>"]
repository = "https://github.com/zyvorai/zorvia"
homepage = "https://zyvor.dev"
documentation = "https://docs.rs/zorvia"
readme = "README.md"
keywords = ["kubevirt", "kubernetes", "virtual-machine", "kvm", "cli"]
categories = ["command-line-utilities", "virtualization"]
rust-version = "1.76"

[[bin]]
name = "zorvia"
path = "src/main.rs"

[lib]
name = "zorvia"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
kube = { version = "0.95", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
schemars = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
regex = "1.10"
chrono = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
rand = "0.8"

# TUI dependencies
ratatui = "0.28"
crossterm = "0.28"
colored = "3.1"
owo-colors = "4.0"
miette = { version = "7.0", features = ["fancy"] }
toml = "0.8"
dirs = "5.0"
rustyline = "17.0"

# Web dashboard dependencies
axum = { version = "0.7", optional = true, features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tower-http = { version = "0.6", features = ["cors", "timeout", "fs"], optional = true }
jsonwebtoken = { version = "9", optional = true }
bcrypt = { version = "0.15", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth"], optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
urlencoding = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.24", optional = true, default-features = false, features = ["connect", "native-tls"] }
native-tls = { version = "0.2", optional = true }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
secrecy = "0.8"
pty-process = { version = "0.5.3", features = ["async"], optional = true }

[features]
default = ["web"]
web = [
  "axum", "axum-server", "rustls", "tower-http",
  "dep:jsonwebtoken", "dep:bcrypt", "dep:rusqlite", "dep:uuid",
  "dep:totp-rs", "dep:base64", "dep:sha2", "dep:subtle", "dep:urlencoding",
  "dep:futures-util", "dep:tokio-tungstenite", "dep:native-tls",
  "dep:reqwest", "dep:pty-process",
]
# PAM host auth (Linux): enable with --features pam and system libpam-dev
pam = []

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
