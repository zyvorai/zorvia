name: ubuntu-server
namespace: default
cpu:
  cores: 4
  sockets: 1
  threads: 1
memory:
  size: 8Gi
disks:
  - name: containerdisk
    size: "0"
    boot_order: 1
    source:
      type: containerDisk
      image: quay.io/containerdisks/ubuntu:22.04
  - name: datadisk
    size: 40Gi
    boot_order: 2
    storage_class: standard
    source:
      type: blank
interfaces:
  - name: default
    network: default
    model: virtio
    network_type: pod
cloud_init:
  user_data: |
    #cloud-config
    users:
      - name: admin
        sudo: ALL=(ALL) NOPASSWD:ALL
        ssh_authorized_keys:
          - ssh-rsa AAAAB3NzaC1yc2E... your-key-here
    package_update: true
    packages:
      - qemu-guest-agent
      - nginx
      - git
    runcmd:
      - systemctl enable qemu-guest-agent
      - systemctl start qemu-guest-agent
labels:
  os: ubuntu
  version: "22.04"
