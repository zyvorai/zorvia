{{- if and .Values.rbac.create .Values.rbac.rookBootstrap }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zorvia.fullname" . }}-rook-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zorvia.labels" . | nindent 4 }}
    app.kubernetes.io/component: rook-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zorvia.fullname" . }}-rook-bootstrap
  labels:
    {{- include "zorvia.labels" . | nindent 4 }}
    app.kubernetes.io/component: rook-bootstrap
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "configmaps", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephclusters", "cephblockpools", "cephfilesystems", "cephobjectstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zorvia.fullname" . }}-rook-bootstrap
  labels:
    {{- include "zorvia.labels" . | nindent 4 }}
    app.kubernetes.io/component: rook-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "zorvia.fullname" . }}-rook-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "zorvia.fullname" . }}-rook-bootstrap
    namespace: {{ .Release.Namespace }}
{{- end }}
