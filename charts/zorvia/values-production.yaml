# Production overrides — use with:
#   helm upgrade --install zorvia ./charts/zorvia -n zorvia-system \
#     -f charts/zorvia/values-production.yaml \
#     --set auth.existingSecret=zorvia-auth \
#     --set image.repository=ghcr.io/zyvorai/zorvia \
#     --set image.tag=0.3.3 \
#     --set image.digest=sha256:...

labMode: false
replicaCount: 2

image:
  repository: ghcr.io/zyvorai/zorvia
  tag: "0.3.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  nodePort: null

tls:
  inPod: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: zorvia.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zorvia-tls
      hosts:
        - zorvia.example.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zorvia
              app.kubernetes.io/component: api
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: zorvia
        app.kubernetes.io/component: api

api:
  leaderElection: true
  jwtTtlMinutes: "60"

rbac:
  rookBootstrap: false
