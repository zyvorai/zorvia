labMode: false
replicaCount: 2

image:
  repository: ghcr.io/zyvorai/zorvia
  tag: "0.3.3"
  # Prefer digest pinning in real prod:
  # digest: sha256:...
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  nodePort: null

tls:
  inPod: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: zorvia.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zorvia-tls
      hosts:
        - zorvia.example.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

# Pod-level hardening (container securityContext already drops ALL caps).
podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zorvia
              app.kubernetes.io/component: api
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: zorvia
        app.kubernetes.io/component: api

api:
  leaderElection: true
  jwtTtlMinutes: "60"
  # Optional append-only JSONL for SIEM shippers (alongside SQLite).
  # auditJsonlPath: /data/audit.jsonl

rbac:
  rookBootstrap: false

# Production must supply auth.existingSecret (never lab defaults).
auth:
  existingSecret: zorvia-auth
