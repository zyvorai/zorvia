name: CI Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep OSS
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          semgrep scan --config=auto --error --quiet \
            --exclude=target --exclude=node_modules --exclude=website/build \
            || true
