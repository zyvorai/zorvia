name: CI Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

permissions:
  contents: read

jobs:
  security-p0:
    name: security_p0 and features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Security P0 regression
        run: cargo test --features web --test security_p0 -- --nocapture
      - name: Feature maturity unit tests
        run: cargo test --features web --lib features::
      - name: Lab guard and auth module tests
        continue-on-error: true
        run: cargo test --features web --lib api::auth -- --nocapture
