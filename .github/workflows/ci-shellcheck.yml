name: CI ShellCheck

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "deploy/**/*.sh"
      - ".github/workflows/ci-shellcheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "deploy/**/*.sh"
      - ".github/workflows/ci-shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find scripts deploy -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x -e SC2086,SC1091,SC2034,SC2015
