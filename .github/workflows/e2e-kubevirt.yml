# Kind + KubeVirt smoke E2E (Phase 3)
# Heavy: run on demand or nightly — not on every PR by default.
name: E2E KubeVirt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  kind-kubevirt:
    name: kind + KubeVirt smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      with:
        toolchain: stable
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create cluster
        run: kind create cluster --name zorvia-e2e --wait 120s
      - name: Install KubeVirt (operator + CR)
        run: |
          export VERSION=$(curl -s https://api.github.com/repos/kubevirt/kubevirt/releases/latest | grep tag_name | cut -d '"' -f 4)
          echo "KubeVirt $VERSION"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${VERSION}/kubevirt-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${VERSION}/kubevirt-cr.yaml"
          kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=600s || \
            kubectl -n kubevirt get pods -o wide
      - name: Build zorvia
        run: cargo build --release --features web
      - name: Unit + security regression (no cluster)
        run: |
          cargo test --features web --test security_p0
          cargo test --features web --lib features::
      - name: Smoke — list nodes via kube client path
        run: |
          kubectl get nodes
          kubectl get crd | grep -i kubevirt || true
      - name: Tear down
        if: always()
        run: kind delete cluster --name zorvia-e2e || true
