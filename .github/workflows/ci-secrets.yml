name: CI Secrets & Policies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-committed-secrets:
    name: No lab secrets in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject known lab secrets in tracked files
        run: |
          set -euo pipefail
          # Must not appear in committed deploy/charts values (auth is created via script).
          if git grep -n 'zorvia-lab-jwt-change-me-30152' -- ':!.github/workflows/ci-secrets.yml' ':!CHANGELOG.md' ':!docs/**' ':!SECURITY.md' ':!src/**' ':!tests/**'; then
            echo "::error::Lab JWT default leaked into non-docs path"
            exit 1
          fi
          if git grep -nE 'Admin@321' -- 'deploy/' 'charts/' '.github/' 2>/dev/null; then
            echo "::error::Lab admin password in deploy/charts/github"
            exit 1
          fi
          echo "OK: no lab secret literals in forbidden paths"

  deny-toml-present:
    name: deny.toml present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f deny.toml && grep -q '\[licenses\]' deny.toml
