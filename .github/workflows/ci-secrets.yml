name: CI Secrets & Policies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-committed-secrets:
    name: No lab secrets in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject known lab secrets in tracked files
        run: |
          set -euo pipefail
          # Must not appear in committed deploy/charts values (auth is created via script).
          # Fixed lab JWT/password must not appear in deploy or Helm charts.
          # Allowed: src guards/tests, docs, CHANGELOG, UI lab hints, create-auth-secret.sh.
          if git grep -n 'zorvia-lab-jwt-change-me-30152' -- 'deploy/' 'charts/'; then
            echo "::error::Lab JWT default leaked into deploy/charts"
            exit 1
          fi
          if git grep -nE 'Admin@321' -- 'deploy/' 'charts/'; then
            echo "::error::Lab admin password in deploy/charts"
            exit 1
          fi
          echo "OK: no lab secret literals in deploy/charts"

  deny-toml-present:
    name: deny.toml present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -f deny.toml && grep -q '\[licenses\]' deny.toml
