name: CI Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/ci-docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/ci-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: zorvia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
