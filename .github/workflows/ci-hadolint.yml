name: CI Hadolint

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "deploy/Dockerfile*"
      - ".github/workflows/ci-hadolint.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "deploy/Dockerfile*"
      - ".github/workflows/ci-hadolint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Lint deploy/Dockerfile.local if present
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.local
          failure-threshold: warning
        continue-on-error: true
