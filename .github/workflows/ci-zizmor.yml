name: CI Zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
      with:
        toolchain: stable
      - name: Install zizmor
        run: cargo install zizmor --locked
        continue-on-error: true
      - name: Audit workflows
        run: |
          if command -v zizmor >/dev/null; then
            zizmor .github/workflows || true
          else
            echo "zizmor not installed; skipped"
          fi
