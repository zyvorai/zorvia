name: CI Zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zizmor
        run: cargo install zizmor --locked
        continue-on-error: true
      - name: Audit workflows
        run: |
          if command -v zizmor >/dev/null; then
            zizmor .github/workflows || true
          else
            echo "zizmor not installed; skipped"
          fi
