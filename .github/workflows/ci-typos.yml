name: CI Typos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
        with:
          files: README.md CHANGELOG.md SECURITY.md DEVELOPMENT.md docs/ src/ web/src/ charts/
        continue-on-error: true
